// LibreWolf overrides, read at every start. NixOS: extraPrefsFiles (browser.nix);
// other systems: install.sh links it to ~/.librewolf, which LibreWolf uses when
// that directory exists. Check about:config after a change.

// Hardware video decoding through VA-API (intel-media-driver, iHD; the
// session sets LIBVA_DRIVER_NAME=iHD). force-enabled skips the GPU blocklist.
defaultPref("media.hardware-video-decoding.enabled", true);
defaultPref("media.hardware-video-decoding.force-enabled", true);

// The HD 620 decodes H.264 and VP9 but not AV1. Without AV1, YouTube falls
// back to VP9, which is hardware-decoded (AV1 would be decoded on the CPU).
defaultPref("media.av1.enabled", false);

// Write the session file every 60 s instead of every 15 s (fewer disk wakeups)
defaultPref("browser.sessionstore.interval", 60000);

// macOS dark mode: dark browser UI and prefers-color-scheme: dark for sites
// (no portal or GTK theme tells LibreWolf the system is dark)
defaultPref("ui.systemUsesDarkTheme", 1);
defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
// Use the compositor's title bar (glasswm's traffic lights) instead of tabs in the title bar
defaultPref("browser.tabs.inTitlebar", 0);
