// LibreWolf overrides, read at every start (symlinked by install.sh).
// LibreWolf uses ~/.librewolf when that directory exists; install.sh creates
// it before the first start. Check about:config after a change.

// Hardware video decoding through VA-API (intel-media-driver, iHD; the
// session sets LIBVA_DRIVER_NAME=iHD). force-enabled skips the GPU blocklist.
defaultPref("media.hardware-video-decoding.enabled", true);
defaultPref("media.hardware-video-decoding.force-enabled", true);

// The HD 620 decodes H.264 and VP9 but not AV1. Without AV1, YouTube falls
// back to VP9, which is hardware-decoded (AV1 would be decoded on the CPU).
defaultPref("media.av1.enabled", false);

// Write the session file every 60 s instead of every 15 s (fewer disk wakeups)
defaultPref("browser.sessionstore.interval", 60000);
