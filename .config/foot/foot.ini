# foot: runs as a server (foot --server in ~/.config/dwl/autostart.sh, the glasswm session);
# new windows are opened with footclient.
# JetBrains Mono stands in for SF Mono (not redistributable); the padding keeps
# text clear of glasswm's 16px rounded corners.
[main]
font=JetBrainsMonoNL Nerd Font Mono:size=10
pad=10x10

# macOS dark mode: window background and Apple's system colours
# (red, green, yellow, blue, purple, cyan; brights are the accessible variants)
[colors-dark]
background=1e1e1e
alpha=0.7
foreground=dfdfe0
selection-background=3f638b
selection-foreground=ffffff
regular0=3a3a3c
regular1=ff453a
regular2=32d74b
regular3=ffd60a
regular4=0a84ff
regular5=bf5af2
regular6=64d2ff
regular7=dfdfe0
bright0=636366
bright1=ff6961
bright2=30db5b
bright3=ffd426
bright4=409cff
bright5=da8fff
bright6=70d7ff
bright7=ffffff
