# fnott: minimal config, caelus colours (see man fnott.ini)
anchor=top-right
edge-margin-vertical=26
max-width=420
selection-helper=bemenu --vim-normal-mode -p action
background=141514ff
border-color=ef934dff
title-color=a69d8bff
summary-color=f4decdff
body-color=f4decdff
border-size=1
padding-vertical=10
padding-horizontal=12
title-font=JetBrainsMonoNL Nerd Font Mono:size=9
summary-font=JetBrainsMonoNL Nerd Font Mono:size=10:weight=bold
body-font=JetBrainsMonoNL Nerd Font Mono:size=10
default-timeout=5

[critical]
border-color=f16e65ff
default-timeout=0
