# fnott: macOS-style notification cards (see man fnott.ini): fixed width,
# top right under the menu bar, translucent grey on dwl's liquid glass,
# hairline border, 12px corners (dwl's corner_radius, which also rounds the glass).
anchor=top-right
edge-margin-vertical=36
edge-margin-horizontal=12
min-width=344
max-width=344
selection-helper=bemenu --vim-normal-mode -p action
background=2c2c2e99
border-color=ffffff1a
title-color=98989dff
summary-color=ffffffff
body-color=ebebf5cc
border-size=1
border-radius=12
padding-vertical=12
padding-horizontal=14
title-font=Inter Variable:size=9
summary-font=Inter Variable:size=10:weight=bold
body-font=Inter Variable:size=10
progress-bar-height=6
progress-color=ffffffcc
default-timeout=5

[critical]
border-color=ff453aff
default-timeout=0
